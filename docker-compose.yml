services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: uv run uvicorn backend.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      PYTHONPATH: /app
      REDIS_URL: redis://redis:6379
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_MODEL_ROUTER: ${OPENAI_MODEL_ROUTER:-gpt-4.1-mini}
      OPENAI_MODEL_SUMMARY: ${OPENAI_MODEL_SUMMARY:-gpt-4.1-mini}
      EUROPE_PMC_URL: ${EUROPE_PMC_URL:-https://www.ebi.ac.uk/europepmc/webservices/rest/search}
      LITERATURE_YEARS: ${LITERATURE_YEARS:-5}
      LITERATURE_MAX_RESULTS: ${LITERATURE_MAX_RESULTS:-10}
      MAX_UPLOAD_SIZE_GB: ${MAX_UPLOAD_SIZE_GB:-5}
      BIO_LAB_JOB_DIR: /app/output/jobs
    volumes:
      - ./output/jobs:/app/output/jobs
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: uv run celery -A backend.celery_app.celery_app worker --loglevel=info --concurrency=1
    environment:
      PYTHONPATH: /app
      REDIS_URL: redis://redis:6379
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_MODEL_ROUTER: ${OPENAI_MODEL_ROUTER:-gpt-4.1-mini}
      OPENAI_MODEL_SUMMARY: ${OPENAI_MODEL_SUMMARY:-gpt-4.1-mini}
      EUROPE_PMC_URL: ${EUROPE_PMC_URL:-https://www.ebi.ac.uk/europepmc/webservices/rest/search}
      LITERATURE_YEARS: ${LITERATURE_YEARS:-5}
      LITERATURE_MAX_RESULTS: ${LITERATURE_MAX_RESULTS:-10}
      MAX_UPLOAD_SIZE_GB: ${MAX_UPLOAD_SIZE_GB:-5}
      BIO_LAB_JOB_DIR: /app/output/jobs
    volumes:
      - ./output/jobs:/app/output/jobs
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
