[project]
name = "bio-lab"
version = "0.1.0"
description = "Cell biology AI analysis platform"
requires-python = ">=3.12"
dependencies = [
  "anndata>=0.10,<0.13",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "scanpy>=1.10,<2",
  "scipy>=1.12,<2",
  "streamlit>=1.35,<2",
]

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
