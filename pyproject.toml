[project]
name = "bio-lab"
version = "0.1.0"
description = "Cell biology AI analysis platform"
requires-python = ">=3.12"
dependencies = [
  "anndata>=0.10,<0.13",
  "celery>=5.4,<6",
  "fastapi>=0.115,<1",
  "openai>=1.50,<2",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "python-multipart>=0.0.9,<1",
  "redis>=5,<7",
  "requests>=2.32,<3",
  "scanpy>=1.10,<2",
  "scipy>=1.12,<2",
  "streamlit>=1.35,<2",
  "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
